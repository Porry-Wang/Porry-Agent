[project]
name = "porry-agent"
version = "0.1.0"
description = "生产级 CodingAgent：Task 树 / 意图变更 / 断点恢复 / 五层上下文压缩"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "porry" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "tiktoken>=0.7,<1",
    "httpx2>=2.16.2",
    "openai>=3.57,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/porry_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:porry_agent.*"]

[tool.coverage.run]
source = ["src/porry_agent"]
branch = true
